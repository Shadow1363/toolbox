<body data-tool="whiteboard">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="editor-layout wb-layout">
      <section class="panel editor-main" aria-label="Board">
        <div class="toolbar" id="toolbar"></div>
        <div class="editor-viewport wb-viewport" id="viewport" tabindex="0" aria-label="Whiteboard canvas">
          <canvas id="board"></canvas>
          <textarea id="editor" class="wb-editor" spellcheck="false" hidden aria-label="Edit text"></textarea>
          <div class="wb-zoom" id="zoom"></div>
          <div class="wb-hint" id="hint"></div>
        </div>
        <div class="wb-export-opts" id="export-opts"></div>
        <div id="export"></div>
      </section>
      <aside class="panel editor-side" aria-label="Style">
        <div id="props"></div>
        <section class="ctrl-section"><h3>File</h3><div class="btn-row" id="file"></div></section>
        <section class="ctrl-section"><h3>Shortcuts</h3><div class="kbd-help" id="help"></div></section>
      </aside>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>

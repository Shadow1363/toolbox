<body data-tool="code-screenshot">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="tool-layout">
      <aside class="panel controls-panel" aria-label="Settings">
        <section class="ctrl-section">
          <h3>Code</h3>
          <div class="ctrl">
            <textarea id="code" class="cs-code" rows="11" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea>
          </div>
          <div class="cs-lang">
            <select id="lang" aria-label="Language"></select>
            <span class="ctrl-hint" id="detected"></span>
          </div>
        </section>
        <div id="controls"></div>
      </aside>
      <section class="panel preview-panel" aria-label="Preview">
        <div class="preview-stage cs-stage" id="stage">
          <canvas id="preview" width="800" height="500" title="Click a line to highlight it"></canvas>
          <div class="preview-overlay" id="overlay" hidden></div>
        </div>
        <p class="io-note">Click a line in the preview to highlight it.</p>
        <div id="export"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>

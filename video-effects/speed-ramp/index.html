<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Tomas Martinez (tomasmartinez.xyz)">
  <meta name="copyright" content="© 2026 Tomas Martinez · GPL-3.0-or-later · tm1363-c339e3ad">
  <title>Speed Ramp · Toolbox</title>
  <meta name="description" content="Speed ramp a video with a curve editor: slow motion and fast forward from 0.25× to 4× with smooth easing, pitch-corrected audio and the new length shown live. Runs in your browser.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/assets/js/theme-init.js"></script>
  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="./script.js"></script>
</head>
<body data-tool="speed-ramp">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="tool-layout">
      <aside class="panel controls-panel" aria-label="Settings">
        <section class="ctrl-section"><h3>Media</h3><div id="upload"></div></section>
        <div id="controls"></div>
      </aside>
      <section class="panel preview-panel" aria-label="Preview">
        <div class="preview-stage">
          <canvas id="preview" width="1280" height="720"></canvas>
          <div class="preview-overlay" id="overlay" hidden></div>
        </div>
        <div id="transport"></div>
        <div class="sr-editor">
          <div class="sr-editor-head"><span id="curve-info"></span></div>
          <canvas id="curve" class="sr-curve" tabindex="0" aria-label="Speed curve: click to add a point, drag to change speed, double-click to remove"></canvas>
          <div class="sr-selected" id="curve-selected"></div>
        </div>
        <div id="export"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>

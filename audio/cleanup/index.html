<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Tomas Martinez (tomasmartinez.xyz)">
  <meta name="copyright" content="© 2026 Tomas Martinez · GPL-3.0-or-later · tm1363-c339e3ad">
  <title>Noise Reduction + Volume Normalizer · Toolbox</title>
  <meta name="description" content="Remove background noise from voice recordings (RNNoise), cut rumble, gate silence, add EQ and compression, and normalize loudness to −16 or −14 LUFS. A/B compare, then export. Runs in your browser.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="./style.css">
  <script src="/assets/js/theme-init.js"></script>
  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="./script.js"></script>
</head>
<body data-tool="cleanup">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="tool-layout">
      <aside class="panel controls-panel" aria-label="Settings">
        <section class="ctrl-section"><h3>Audio</h3><div id="upload"></div></section>
        <div id="controls"></div>
      </aside>
      <div class="audio-main">
        <section class="panel audio-panel" aria-label="Before and after">
          <div class="audio-panel-head">
            <h2>Before / after</h2>
            <span class="cu-status" id="status" aria-live="polite"></span>
            <div class="segmented cu-ab" role="group" aria-label="Listen to">
              <button type="button" data-v="a" aria-pressed="false" title="Original (shortcut: B toggles)">A · Original</button>
              <button type="button" data-v="b" aria-pressed="true" title="Processed (shortcut: B toggles)">B · Processed</button>
            </div>
          </div>
          <div id="empty" class="audio-empty">Drop a voice recording, podcast or video on the left (or here).</div>
          <div id="stats" class="audio-stats" hidden></div>
          <div class="waveform-label" id="label-a"><span>Original</span><span id="meta-a"></span></div>
          <div id="wave-a"></div>
          <div class="waveform-label" id="label-b"><span>Processed</span><span id="meta-b"></span></div>
          <div id="wave-b"></div>
          <div id="player"></div>
          <div id="export"></div>
        </section>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>

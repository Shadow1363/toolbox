<body data-tool="color">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="io-grid">
      <section class="panel io-panel" aria-label="Color">
        <div class="io-head"><h2>Color</h2></div>
        <div class="cc-input">
          <input type="color" id="picker" aria-label="Pick a color">
          <input type="text" id="input" spellcheck="false" autocomplete="off" aria-label="Color value" placeholder="#3366ff, rgb(51 102 255), hsl(…), oklch(…), tomato">
        </div>
        <div class="ctrl">
          <label class="ctrl-label" for="alpha"><span>Opacity</span><span class="ctrl-value" id="alpha-value">100%</span></label>
          <input type="range" id="alpha" min="0" max="100" value="100">
        </div>
        <div class="io-status" id="status"></div>
        <div class="cc-swatch checker"><div id="swatch"></div></div>
        <div class="cc-contrast" id="contrast"></div>
      </section>
      <section class="panel io-panel" aria-label="Formats">
        <div class="io-head"><h2>Formats</h2></div>
        <div class="io-rows" id="rows"></div>
        <p class="io-note">Type any CSS color on the left: hex, rgb(), hsl(), oklch() or a name like “tomato”.</p>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>

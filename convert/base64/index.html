<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base64 Encoder &amp; Decoder · Toolbox</title>
  <meta name="description" content="Encode text or files to Base64, Base64URL or data URIs, and decode Base64 back to text, images or files. Runs in your browser.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/theme-init.js"></script>
  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="./script.js"></script>
</head>
<body data-tool="base64">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="panel io-options" id="options"></div>
    <div class="io-grid">
      <section class="panel io-panel" aria-label="Input">
        <div class="io-head"><h2 id="in-title">Text</h2><span id="in-actions"></span></div>
        <textarea id="input" spellcheck="false" placeholder="Type or paste text…"></textarea>
        <div id="in-file"></div>
        <div id="drop"></div>
      </section>
      <section class="panel io-panel" aria-label="Output">
        <div class="io-head"><h2 id="out-title">Base64</h2><span id="out-actions"></span></div>
        <div class="io-status" id="status"></div>
        <textarea id="output" readonly spellcheck="false"></textarea>
        <div id="out-extra"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>

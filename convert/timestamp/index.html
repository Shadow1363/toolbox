<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timestamp Converter · Toolbox</title>
  <meta name="description" content="Convert Unix timestamps (seconds or milliseconds) to ISO 8601 and readable dates in any time zone, and back.">
  <link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/theme-init.js"></script>
  <script type="module" src="/assets/js/site.js"></script>
  <script type="module" src="./script.js"></script>
</head>
<body data-tool="timestamp">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <div class="io-grid">
      <section class="panel io-panel" aria-label="Input">
        <div class="io-head"><h2>Date or timestamp</h2><span id="in-actions"></span></div>
        <input type="text" id="input" class="mono" spellcheck="false" autocomplete="off" aria-label="Date or timestamp" placeholder="1700000000, 1700000000000, 2024-05-01T10:00:00Z, 2024-05-01 10:00">
        <div id="options"></div>
        <div class="io-status" id="status"></div>
        <p class="io-note" id="clock"></p>
      </section>
      <section class="panel io-panel" aria-label="Results">
        <div class="io-head"><h2>Converted</h2></div>
        <div class="io-rows" id="rows"></div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>

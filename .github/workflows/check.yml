name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Registry ↔ folders ↔ thumbnails ↔ share images ↔ meta tags ↔ sitemap ↔ issue templates ↔ CDN pins
      - run: node scripts/check.mjs

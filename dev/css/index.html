<body data-tool="css">
  <header id="site-header" class="site-header"></header>
  <main class="container">
    <div data-tool-head></div>
    <nav class="dev-tabs" aria-label="Generator"><div class="segmented" id="tabs" role="group" aria-label="Generator"></div></nav>
    <div class="tool-layout">
      <aside class="panel controls-panel" aria-label="Settings">
        <div id="controls"></div>
      </aside>
      <section class="panel preview-panel cg-result" aria-label="Preview and code">
        <div id="preview" class="cg-preview"></div>
        <div class="cg-code">
          <div class="io-head"><h2>CSS</h2><span id="css-actions"></span></div>
          <pre class="io-out cg-pre" id="css-out"></pre>
        </div>
        <div class="cg-code">
          <div class="io-head"><h2>Tailwind</h2><span id="tw-actions"></span></div>
          <pre class="io-out cg-pre" id="tw-out"></pre>
          <div class="io-note" id="tw-note"></div>
        </div>
      </section>
    </div>
  </main>
  <footer id="site-footer"></footer>
